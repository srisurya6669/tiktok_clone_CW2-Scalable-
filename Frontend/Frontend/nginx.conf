server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build files never change, so browsers can cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes such as /profile and /login fall back to the app.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
