# Backend API: Express + MongoDB + Azure Blob Storage + Azure AI Language.
# Secrets (MongoDB, JWT, Azure keys) come from the "scaletok-backend-env" Secret,
# created from Backend/.env (see k8s/README.md), so they never go into git or the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: scaletok
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: scaletokacr123.azurecr.io/scaletok-backend:v1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: scaletok-backend-env
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Only send traffic once the API is connected to MongoDB.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Restart the container if it stops responding.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: scaletok
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000
