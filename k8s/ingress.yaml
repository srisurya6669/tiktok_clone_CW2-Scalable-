# One public address for the whole site: /api and /health go to the backend,
# everything else to the frontend. Uses the AKS "application routing" add-on (managed nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scaletok
  namespace: scaletok
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
