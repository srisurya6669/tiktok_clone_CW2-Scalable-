# The AKS application routing add-on's nginx controller. The annotation gives its public IP
# a free Azure DNS name: scaletok.polandcentral.cloudapp.azure.com
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: default
spec:
  controllerNamePrefix: nginx
  ingressClassName: webapprouting.kubernetes.azure.com
  # Single node: the default 2 replicas reserve 1 CPU of the node, leaving no room for the app.
  scaling:
    minReplicas: 1
    maxReplicas: 2
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-dns-label-name: scaletok
